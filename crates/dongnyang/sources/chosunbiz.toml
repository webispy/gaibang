# 조선비즈 (Arc publishing). Declares Content-Signal: ai-input=yes, ai-train=no (2026-10-14). RSS has no
# category, but the URL path does (/industry/company/2026/10/20/<ID>/). Ad slots are .arcad-*.
id = "chosunbiz"
outlet = "조선비즈"
hosts = ["biz.chosun.com"]
min_interval_secs = 3.0
feeds = ["https://biz.chosun.com/arc/outboundfeeds/rss/?outputType=xml"]
article_path = '^/[a-z0-9_/-]+/\d{4}/\d{2}/\d{2}/[A-Z0-9]+/?$'
id_pattern = '/([A-Z0-9]{20,})/?$'
skip_url_prefixes = ["https://biz.chosun.com/jp/"]

[categories]
keys = ["jsonld:articleSection", "meta:article:section", "rss:category", "url:path"]
url_depth = 2

[article]
body = ["section.article-body", "[itemprop=articleBody]"]
drop = ["script", "style", "figure", "figcaption", "button", "noscript", "iframe", "table", "aside", "svg",
        "[class^=arcad]", "[class*=' arcad']", ".article-ad"]
